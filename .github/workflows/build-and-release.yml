name: Build and Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK type"
        type: choice
        options:
          - release
          - debug
        default: release
        required: true
      version_name:
        description: "Version name (for example 2.0.1)"
        type: string
        default: "2.0.0"
        required: true
      version_code:
        description: "Android versionCode (positive integer; blank = GitHub run number)"
        type: string
        default: ""
        required: false
      release_tag:
        description: "Release tag (blank = v<version_name>; does not need to exist yet)"
        type: string
        default: ""
        required: false
      release_title:
        description: "GitHub release title (blank = v<version_name>)"
        type: string
        default: ""
        required: false
      release_notes:
        description: "Release notes"
        type: string
        default: "Built with GitHub Actions."
        required: false
      create_release:
        description: "Publish APK as a GitHub Release"
        type: choice
        options:
          - "yes"
          - "no"
        default: "yes"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Verify and sign release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG_INPUT: ${{ inputs.release_tag || '' }}
      BUILD_TYPE: ${{ inputs.build_type || 'release' }}
      VERSION_NAME_INPUT: ${{ inputs.version_name || '' }}
      VERSION_CODE_INPUT: ${{ inputs.version_code || '' }}
      CREATE_RELEASE: ${{ inputs.create_release || 'yes' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          # Manual runs without a tag build the selected branch (normally main).
          # Tag-triggered runs always build the exact tag that triggered them.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Resolve build and release options
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$VERSION_NAME_INPUT"
          if [[ -z "$VERSION_NAME" ]]; then
            VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          fi
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version_name '$VERSION_NAME'. Use a version such as 2.0.1."
            exit 1
          fi
          VERSION_CODE="$VERSION_CODE_INPUT"
          if [[ -z "$VERSION_CODE" ]]; then VERSION_CODE="$GITHUB_RUN_NUMBER"; fi
          if [[ ! "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::version_code must be a positive integer."
            exit 1
          fi
          if [[ "$BUILD_TYPE" != "release" && "$BUILD_TYPE" != "debug" ]]; then
            echo "::error::build_type must be release or debug."
            exit 1
          fi
          TAG="$RELEASE_TAG_INPUT"
          if [[ -z "$TAG" ]]; then TAG="v$VERSION_NAME"; fi
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release_tag '$TAG'. Use a tag such as v2.0.1."
            exit 1
          fi
          if [[ "$TAG" != v* ]]; then TAG="v$TAG"; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"
          echo "create_release=$CREATE_RELEASE" >> "$GITHUB_OUTPUT"
          echo "### App Lock APK build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build type: $BUILD_TYPE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: $VERSION_NAME (code $VERSION_CODE)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release tag: $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publish release: $CREATE_RELEASE" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5

      - name: Ensure compile SDK from hosted runner
        run: |
          if [[ ! -d "$ANDROID_HOME/platforms/android-36.1" || ! -d "$ANDROID_HOME/build-tools/36.0.0" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36.1' 'build-tools;36.0.0'
          fi

      - name: Verify before signing
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      - name: Restore existing release key
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo 'Configure the existing release signing key and password secrets. A new key will NOT be generated.'
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build selected APK
        run: |
          if [[ "$BUILD_TYPE" == "release" ]]; then
            ./gradlew :app:assembleRelease --stacktrace --console=plain -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
          else
            ./gradlew :app:assembleDebug --stacktrace --console=plain -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
          fi
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'upload' }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Create release tag for a new version
        if: env.CREATE_RELEASE_TAG == 'true'
        run: |
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Collect selected APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "$BUILD_TYPE" == "release" ]]; then SOURCE="app/build/outputs/apk/release"; else SOURCE="app/build/outputs/apk/debug"; fi
          find "$SOURCE" -maxdepth 1 -type f -name '*.apk' -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -name '*.apk' -print -quit)"
          ls -lh dist
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-lock-${{ env.BUILD_TYPE }}-v${{ env.VERSION_NAME }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: steps.release.outputs.create_release == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          name: ${{ inputs.release_title != '' && inputs.release_title || format('v{0}', env.VERSION_NAME) }}
          tag_name: ${{ env.RELEASE_TAG }}
          body: ${{ inputs.release_notes || 'Built with GitHub Actions.' }}
          draft: false
          prerelease: false
