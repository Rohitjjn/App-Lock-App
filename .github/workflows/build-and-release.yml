name: Build and Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to rebuild (leave blank to release the version in app/build.gradle.kts)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Verify and sign release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG_INPUT: ${{ inputs.release_tag || '' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # Manual runs without a tag build the selected branch (normally main).
          # Tag-triggered runs always build the exact tag that triggered them.
          ref: ${{ inputs.release_tag && (startsWith(inputs.release_tag, 'v') && inputs.release_tag || format('v{0}', inputs.release_tag)) || github.ref }}
          fetch-depth: 0

      - name: Resolve and validate release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$RELEASE_TAG_INPUT" ]]; then
            if [[ ! "$RELEASE_TAG_INPUT" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid release tag '$RELEASE_TAG_INPUT'. Use 1.2.3 or v1.2.3."
              exit 1
            fi
            RELEASE_TAG="v${RELEASE_TAG_INPUT#v}"
            if ! git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null; then
              echo "::error::Tag '$RELEASE_TAG' does not exist. Leave release_tag blank to build the current branch version, or create/push this exact tag first."
              exit 1
            fi
            if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]]; then
              echo "::error::Checked-out commit does not match tag '$RELEASE_TAG'."
              exit 1
            fi
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            # Derive the tag from the actual Android app version, not a guessed input.
            VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
            if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Could not read a valid versionName from app/build.gradle.kts."
              exit 1
            fi
            RELEASE_TAG="v$VERSION_NAME"
            if git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null; then
              echo "::error::Tag '$RELEASE_TAG' already exists. Select that tag in release_tag to rebuild it, or increment versionName/versionCode for a new release."
              exit 1
            fi
            # Create the version tag only after tests and signing succeed.
            echo "CREATE_RELEASE_TAG=true" >> "$GITHUB_ENV"
          fi

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $RELEASE_TAG"

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Ensure compile SDK from hosted runner
        run: |
          if [[ ! -d "$ANDROID_HOME/platforms/android-36.1" || ! -d "$ANDROID_HOME/build-tools/36.0.0" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36.1' 'build-tools;36.0.0'
          fi

      - name: Verify before signing
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      - name: Restore existing release key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo 'Configure the existing release signing key and password secrets. A new key will NOT be generated.'
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build signed release APKs
        run: ./gradlew :app:assembleRelease
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'upload' }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Create release tag for a new version
        if: env.CREATE_RELEASE_TAG == 'true'
        run: |
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Release-APKs
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          name: ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          body: Download the APK matching your device, or choose the universal APK.
          draft: false
          prerelease: false
