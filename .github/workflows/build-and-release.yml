name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # Trigger on version tags, e.g. v1.0.0
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.3.1

      - name: Generate Release Keystore
        run: keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Release"

      - name: Create .env file
        run: touch .env

      - name: Build Release APKs
        run: gradle assembleRelease
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Release-APKs
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          name: Release ${{ github.ref_name }}
          body: "New update available!"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
