name: Build and Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to release (for example v2.0.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Verify and sign release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG_INPUT: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && (startsWith(inputs.release_tag, 'v') && inputs.release_tag || format('v{0}', inputs.release_tag)) || github.ref }}
          fetch-depth: 0
      - name: Validate release tag
        run: |
          # Accept either 1.0.2 or v1.0.2 from workflow_dispatch; push-tag runs
          # already use the canonical vX.Y.Z form.
          if [[ "$RELEASE_TAG_INPUT" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            RELEASE_TAG="v${RELEASE_TAG_INPUT#v}"
          else
            echo "::error::Invalid release tag '$RELEASE_TAG_INPUT'. Use 1.2.3 or v1.2.3."
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          if ! git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null; then
            echo "::error::Tag '$RELEASE_TAG' does not exist in Rohitjjn/App-Lock-App. Create and push that version tag first, then rerun this workflow."
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure compile SDK from hosted runner
        run: |
          if [[ ! -d "$ANDROID_HOME/platforms/android-36.1" || ! -d "$ANDROID_HOME/build-tools/36.0.0" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36.1' 'build-tools;36.0.0'
          fi
      - name: Verify before signing
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug
      - name: Restore existing release key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo 'Configure the existing release signing key and password secrets. A new key will NOT be generated.'
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APKs
        run: ./gradlew :app:assembleRelease
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'upload' }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Release-APKs
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          name: ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          body: Download the APK matching your device, or choose the universal APK.
          draft: false
          prerelease: false
