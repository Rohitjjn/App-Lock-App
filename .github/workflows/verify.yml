name: Verify Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure compile SDK from hosted runner
        run: |
          if [[ ! -d "$ANDROID_HOME/platforms/android-36.1" || ! -d "$ANDROID_HOME/build-tools/36.0.0" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36.1' 'build-tools;36.0.0'
          fi
      - name: Test, lint and build debug APK
        shell: bash
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/safelock-verify.log"
      - name: Report lint and unit test XML results
        if: always()
        run: python3 tools/report-ci-results.py
      - name: Surface failure details in check annotations
        if: failure()
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          log = Path(os.environ["RUNNER_TEMP"]) / "safelock-verify.log"
          if log.exists():
              excerpt = log.read_text(errors="replace")[-3500:]
              escaped = excerpt.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Android verification failure::{escaped}")
          PYTHON
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: app/build/reports/
          if-no-files-found: warn
